<!-- Wait for auth -->
<ng-container *ngIf="!loading">

  <!-- ================= USER VIEW ================= -->
  <section *ngIf="isUser" class="user-hero">
    <div class="hero-overlay">
      <h1>Reserve Your Table</h1>
      <p>An unforgettable dining experience awaits you</p>
    </div>
  </section>

  <section *ngIf="isUser" class="reservation-section">
    <div class="reservation-form-container">
      <form class="reservation-form" (ngSubmit)="submitForm()">
        <h2>Reservation Details</h2>

        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" required [(ngModel)]="date" name="date">
          </div>

          <div class="form-group">
            <label>Time</label>
            <input type="time" required [(ngModel)]="time" name="time">
          </div>

          <div class="form-group">
            <label>Guests</label>
            <input type="number" min="1" required [(ngModel)]="numOfGuests" name="numOfGuests">
          </div>
        </div>

        <button type="submit" class="btn primary">
          Confirm Reservation
        </button>
      </form>
    </div>
  </section>

  <!-- ================= ADMIN VIEW ================= -->
  <section *ngIf="isAdmin || isStaff" class="reservation-section">
    <div class="reservation-form-container admin-container">
      <h2>All Reservations</h2>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Guests</th>
              <th>Status</th>
              <th>Customer</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let r of reservations">
              <td>{{ r.date | date:'yyyy-MM-dd' }}</td>
              <td>{{ r.time }}</td>
              <td>{{ r.numberOfGuests }}</td>
              <td>
            <span class="status-badge" [ngClass]="getStatusClass(r.status)">
              {{ r.status }}
            </span>
              </td>
              <td>{{ r.customer || '—' }}</td>
              <td class="actions">
                <button class="btn approve" (click)="approveReservation(r._id)">Approve</button>
                <button class="btn delete" (click)="cancelReservation(r._id)">Cancel</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

</ng-container>
