<header class="page-header">
  <h1>Book Your Table</h1>
  <p>We look forward to welcoming you.</p>
</header>

<section class="reservation-section">
  <div class="reservation-form-container">
    <form class="reservation-form" (ngSubmit)="submitForm()" > 
      <h2>Reservation Details</h2>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required [(ngModel)]="date" name="date">
        </div>
        <div class="form-group">
          <label for="time">Time</label>
          <input type="time" id="time" required [(ngModel)]="time" name="time">
        </div>
        <div class="form-group">
          <label for="guests">Number of Guests</label>
          <input type="number" id="guests" placeholder="4" required [(ngModel)]="numOfGuests" name="numOfGuests">
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Confirm Reservation</button>
    </form>
  </div>
</section>
