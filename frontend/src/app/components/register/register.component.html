<div class="container">
    <h1>Register</h1>
    <form (ngSubmit) = "handleRegister()">
        <input type="name" [(ngModel)] = "name" name="name" placeholder="Enter your name...">
        <input type="email" [(ngModel)] = "email" name="email" placeholder="Enter your email...">
        <input type="password" [(ngModel)] = "password" name="password" placeholder="Enter your password...">
        <select name="role"  [(ngModel)] = "role">
            <option value="" disabled>Select role...</option>
            <option value="User" >User</option>
            <option value="Staff">Staff</option>
            <option value="Admin">Admin</option>
        </select>
        <button type="submit"> Submit</button>
    </form>
</div>
