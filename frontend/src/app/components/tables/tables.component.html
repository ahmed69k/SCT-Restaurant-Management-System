<!-- tables.component.html -->
<div class="tables-container" *ngIf="isFormHidden">
  <h2>Tables List</h2>

  <table *ngIf="tables.length > 0; else noTables" border="1" cellpadding="8">
    <thead>
      <tr>
        <th>isFree</th>
        <th>Type</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let table of tables">
        <td>{{ table.isFree }}</td>
        <td>{{ table.seatingType }}</td>
        <td>
          <!-- Example action buttons -->
          <button>View</button>
          <button>Edit</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noTables>
    <p>No tables found.</p>
  </ng-template>
  
</div>
<div *ngIf="!isFormHidden">
    <form (ngSubmit)="createTable()">
        <select name="seatingType" id="" [(ngModel)]="seatingType">
            <option value="" disabled>Select a seating type</option>
            <option value="Booth"> Booth </option>
            <option value="Table"> Table </option>
            <option value="Couch"> Couch </option>
            <option value="Double"> Double </option>
        </select>
        <button type="submit" (click)="toggleForm()">Submit </button>
    </form>
</div>


<button (click)="toggleForm()">Add Table</button>
