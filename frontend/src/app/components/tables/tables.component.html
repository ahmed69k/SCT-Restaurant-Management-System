<div class="tables-container" *ngIf="isFormHidden">
  <h2 class="page-title">Tables List</h2>

  <div *ngIf="tables.length > 0; else noTables" class="tables-grid">
    <div class="table-card" *ngFor="let table of tables">
      <div class="table-type">{{ table.seatingType }}</div>
      <div class="table-icon" [ngClass]="table.isFree ? 'free' : 'occupied'">
        <i class="material-icons">
          {{ table.seatingType === 'Couch' || table.seatingType === 'Booth' ? 'weekend' : 'table_chart' }}
        </i>
      </div>
    </div>
  </div>

  <ng-template #noTables>
    <p class="empty-state">No tables found.</p>
  </ng-template>

  <button class="btn add-btn" (click)="toggleForm()">Add Table</button>
</div>

<div *ngIf="!isFormHidden" class="table-form-container">
  <button class="btn back-btn" (click)="toggleForm()">Back</button>

  <form (ngSubmit)="createTable()" class="table-form">
    <h2>Add New Table</h2>
    <label for="seatingType">Select a seating type</label>
    <select name="seatingType" id="seatingType" [(ngModel)]="seatingType" required>
      <option value="" disabled>Select a seating type</option>
      <option value="Booth">Booth</option>
      <option value="Table">Table</option>
      <option value="Couch">Couch</option>
      <option value="Double">Double</option>
    </select>

    <button type="submit" class="btn submit-btn">Submit</button>
  </form>
</div>
