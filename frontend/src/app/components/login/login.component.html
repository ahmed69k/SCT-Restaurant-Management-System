<div class="form-container">
  <div class="form-card">
    <h2>Login</h2>
    <p class="form-subtitle">Welcome back! Please enter your details.</p>

    <form (ngSubmit)="handleLogin()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Enter your password" required>
      </div>
      <p style="color: red;">{{error}}</p>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
    <p class="form-footer">Don't have an account? <a routerLink="/register">Sign Up</a></p>
  </div>
</div>
